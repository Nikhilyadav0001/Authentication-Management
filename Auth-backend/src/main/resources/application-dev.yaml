server:
  port: 8081

spring:
  application:
    name: Auth-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: root

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    org.springframework.web: DEBUG

security:
  jwt:
    secret:${JWT_SECRET:nikhilgr[adfe}fadfaehfihdjhvhvnfaejh}
    issuer:${JWT_ISSUER:authbackend.auth.com}
    access-ttl-seconds:${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds:${JWT_REFRESH_TTL_SECONDS:86400}
    refresh-token-cookie-name:${JWT_REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure:${JWT_COOKIE_SECURE:true}
    cookie-http-only:${JWT_COOKIE_HTTP_ONLY:true}
    cookie-same-site:${JWT_COOKIE_SAME_SITE:lax}
