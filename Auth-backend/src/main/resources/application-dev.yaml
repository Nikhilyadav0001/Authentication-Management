server:
  port: 8081

spring:
  application:
    name: Auth-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: root

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  #OAuth 2  configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-client-secret}
            scope:
              - email
              - profile
              - openid
          github:
            client-id: ${GITHUB_CLIENT_ID:test-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:test-client-id}
            scope:
              - user:email
              - read:user
logging:
  level:
    org.springframework.web: DEBUG

security:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLWp3dC1zZWNyZXQta2V5LWF1dGgtYXBwLWJhY2tlbmQtMjU2LWJpdC1vci01MTItYml0cy1sb25nLWVub3VnaA==}
    issuer: ${JWT_ISSUER:authbackend.auth.com}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}
    cookie-domain: ${JWT_COOKIE_DOMAIN:localhost}

app:
  auth:
    frontend:
      success-redirect: http://localhost:5173/auth/success
      failure-redirect: http://localhost:5173/auth/failure
