server:
  port: 8081

spring:
  application:
    name: Auth-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: root

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    org.springframework.web: DEBUG